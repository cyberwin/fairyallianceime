name: CyberWin Build and Release APK
on:
  push:
    tags:
      - 'v*.*.*'
  # 【新增】支持网页手动触发测试打包，不用每次打tag
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-
      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon
      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      # ==========【修复：增加base64解码，生成真实keystore文件】==========
      - name: Decode signing keystore from base64
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/release.keystore
      - name: Setup signing keystore properties
        run: |
          cat > app/keystore.properties <<'EOF'
          storeFile=release.keystore
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Release APKs (Signed)
        run: ./gradlew assembleRelease --no-daemon

      # ==========【新增！打印apk目录，看真实文件名，调试用】==========
      - name: List release APK output dir
        run: ls -la app/build/outputs/apk/release/

      - name: Build Plugin XIPKs (Unsigned)
        run: bash scripts/build-plugins.sh

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" >/dev/null
            echo "Verified: $apk"
          done

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ==========【修复find_apks：不再限制faime-前缀，匹配所有apk】==========
      - name: Find APKs and plugin XIPKs
        id: find_apks
        run: |
          # 匹配release目录下全部apk
          MAIN_APKS=$(find app/build/outputs/apk/release -name "*.apk" -type f | sort)
          PLUGIN_XIPKS=$(find build/plugin-release -name "*.xipk" -type f | sort)
          echo "$MAIN_APKS" > apks.list
          echo "$PLUGIN_XIPKS" > xipks.list
          echo "main_apks_file=apks.list" >> $GITHUB_OUTPUT
          echo "plugin_xipks_file=xipks.list" >> $GITHUB_OUTPUT
          if [ -z "$MAIN_APKS" ]; then
            echo "::error::No main app APKs found!"
            exit 1
          fi
          if [ -z "$PLUGIN_XIPKS" ]; then
            echo "::warning::No plugin XIPKs found!"
          fi

      # ==========【改用文件列表方式给gh-release，规避逗号bug】==========
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Xime ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: false
          files: |
            @${{ steps.find_apks.outputs.main_apks_file }}
            @${{ steps.find_apks.outputs.plugin_xipks_file }}
          overwrite: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-xipm:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 cross toolchain (Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/xime-plugin/target
          key: cargo-xipm-${{ matrix.target }}-${{ hashFiles('tools/xime-plugin/Cargo.lock') }}
          restore-keys: |
            cargo-xipm-${{ matrix.target }}-
      - name: Build xipm
        working-directory: tools/xime-plugin
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          BIN_DIR="tools/xime-plugin/target/$TARGET/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            tar.exe -a -c -f "xipm-$TARGET.zip" -C "$BIN_DIR" xipm.exe
          else
            tar czf "xipm-$TARGET.tar.gz" -C "$BIN_DIR" xipm
          fi
          ls -la xipm-$TARGET.*
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xipm-${{ matrix.target }}
          path: xipm-*
          if-no-files-found: error
  publish-xipm:
    runs-on: ubuntu-latest
    needs: [build, build-xipm]
    steps:
      - name: Download xipm artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xipm-*
          merge-multiple: true
          path: xipm-dist
      - name: Attach xipm binaries to release
        uses: softprops/action-gh-release@v3
        with:
          files: xipm-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
